server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Shortlink redirect for resume
    location = /resume {
        return 302 /Eklavya_Ghodake_Resume.pdf;
    }

    # Hashed Astro bundles - immutable cache for 1 year
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # OpenGraph dynamic/generated images
    location ^~ /og/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # PDF Resume cache
    location = /Eklavya_Ghodake_Resume.pdf {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static assets, fonts, icons
    location ~* \.(?:ico|png|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Route matching for Astro static output (e.g. /work/machinewise)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Custom 404 handler
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
