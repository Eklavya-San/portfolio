<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-glow-machinewise" cx="0%" cy="0%" r="60%" fx="0%" fy="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.22)" />
      <stop offset="100%" stop-color="rgba(3, 7, 18, 0)" />
    </radialGradient>
    <radialGradient id="br-glow-machinewise" cx="100%" cy="100%" r="50%" fx="100%" fy="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.10)" />
      <stop offset="100%" stop-color="rgba(3, 7, 18, 0)" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Dark Obsidian Base -->
  <rect width="1200" height="630" fill="#030712" />

  <!-- Ambient Glows -->
  <rect width="1200" height="630" fill="url(#bg-glow-machinewise)" />
  <rect width="1200" height="630" fill="url(#br-glow-machinewise)" />

  <!-- Subtle Engineering Grid -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Border Card Inset -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="rgba(17, 24, 39, 0.4)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Brand Pill Header -->
  <g transform="translate(80, 75)">
    <rect width="138" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <circle cx="18" cy="18" r="5" fill="#10b981" />
    <text x="32" y="23" fill="#f9fafb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">claudya.in</text>
  </g>

  <!-- Category Badge -->
  <g transform="translate(230, 75)">
    <rect width="280" height="36" rx="18" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="20" y="23" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">FLAGSHIP CASE STUDY // 01</text>
  </g>

  <!-- Title -->
  <text x="80" y="210" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">MachineWise</text>

  <!-- Tagline / Description (Two-line wrapped) -->
  <text x="80" y="280" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" width="1040">
    High-throughput industrial telemetry, event-driven time-series compression, and zero-loss production recovery.
  </text>

  <!-- Metric Badges -->
  
      <g transform="translate(80, 470)">
        <rect width="330" height="94" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
        <text x="24" y="44" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="700">-70%</text>
        <text x="24" y="72" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">DB Storage</text>
      </g>
    
      <g transform="translate(440, 470)">
        <rect width="330" height="94" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
        <text x="24" y="44" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="700">0</text>
        <text x="24" y="72" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">DR Data Loss</text>
